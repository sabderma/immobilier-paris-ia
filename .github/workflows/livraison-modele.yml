name: Livraison continue du modele IA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Tester le modele IA
        run: python -m unittest discover -s tests -p "test_prediction.py" -v

      - name: Livrer le modele
        uses: actions/upload-artifact@v4
        with:
          name: modele-immobilier-paris
          path: |
            models/xgboost_prix_dvf.joblib
            models/xgboost_prix_dvf_metrics.json