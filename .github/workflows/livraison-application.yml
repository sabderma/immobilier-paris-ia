name: Livraison continue application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: immobilier-paris-api
  STREAMLIT_IMAGE_NAME: immobilier-paris-streamlit
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: immobilier_paris_test
  API_KEY: test-api-key
  JWT_SECRET_KEY: secret-de-test-jwt-avec-32-caracteres-minimum
  IDFM_API_KEY: test-idfm-key
  OPENAI_API_KEY: test-openai-key
  OPENAI_MODEL: gpt-5.4-mini
  GRAFANA_ADMIN_PASSWORD: test-grafana-password

jobs:
  construire-et-publier:
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.images.outputs.owner }}

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Preparer les noms des images
        id: images
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Verifier la configuration Docker Compose locale
        run: docker compose -f compose.yml config

      - name: Verifier la configuration Docker Compose production
        env:
          IMAGE_OWNER: ${{ steps.images.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f compose.prod.yml config

      - name: Preparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}

      - name: Construire et publier l'image Streamlit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.streamlit
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.STREAMLIT_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.STREAMLIT_IMAGE_NAME }}:${{ github.sha }}

  deployer-serveur:
    needs: construire-et-publier
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_APPLICATION == 'true'

    steps:
      - name: Configurer SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Mettre a jour l'application Docker sur le serveur
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_OWNER: ${{ needs.construire-et-publier.outputs.image_owner }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             export REGISTRY='ghcr.io' IMAGE_OWNER='$IMAGE_OWNER' IMAGE_TAG='latest' && \
             docker compose -f compose.prod.yml pull api streamlit && \
             docker compose -f compose.prod.yml up -d && \
             docker compose -f compose.prod.yml ps"
