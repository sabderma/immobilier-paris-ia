name: Livraison continue application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: immobilier-paris-api
  STREAMLIT_IMAGE_NAME: immobilier-paris-streamlit
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: immobilier_paris_test
  API_KEY: test-api-key
  JWT_SECRET_KEY: secret-de-test-jwt-avec-32-caracteres-minimum
  IDFM_API_KEY: test-idfm-key
  OPENAI_API_KEY: test-openai-key
  OPENAI_MODEL: gpt-5.4-mini
  GRAFANA_ADMIN_PASSWORD: test-grafana-password

jobs:
  tester-application:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Tester les routes API
        run: python -m unittest discover -s tests -p "test_api.py" -v

      - name: Tester l'authentification
        run: python -m unittest discover -s tests -p "test_auth.py" -v

  valider-modele-ia:
    runs-on: ubuntu-latest
    env:
      DONNEES_ENTRAINEMENT: data/final/dvf_paris_clean_2021_2025.csv
      DOSSIER_LIVRAISON: livraison
      MODELE_LIVRE: livraison/xgboost_prix_dvf.joblib
      METRIQUES_LIVREES: livraison/xgboost_prix_dvf_metrics.json
      RAPPORT_LIVRAISON: livraison/rapport_livraison_modele.md

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier les donnees d'entrainement
        run: python -m unittest discover -s tests -p "test_donnees_livraison.py" -v

      - name: Entrainer un nouveau modele IA
        run: |
          mkdir -p "$DOSSIER_LIVRAISON"
          python -m src.prediction.entrainement_xgboost_prix \
            --input "$DONNEES_ENTRAINEMENT" \
            --output-model "$MODELE_LIVRE" \
            --output-metrics "$METRIQUES_LIVREES"

      - name: Tester le nouveau modele IA
        run: |
          cp "$MODELE_LIVRE" models/xgboost_prix_dvf.joblib
          cp "$METRIQUES_LIVREES" models/xgboost_prix_dvf_metrics.json
          python -m unittest discover -s tests -p "test_prediction.py" -v

      - name: Generer le rapport de validation
        run: |
          python scripts/generer_rapport_livraison_modele.py \
            --metrics "$METRIQUES_LIVREES" \
            --output "$RAPPORT_LIVRAISON" \
            --minimum-r2 0.80

  construire-et-publier:
    needs:
      - tester-application
      - valider-modele-ia
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.images.outputs.owner }}

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Preparer les noms des images
        id: images
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Verifier la configuration Docker Compose locale
        run: docker compose -f compose.yml config

      - name: Verifier la configuration Docker Compose production
        env:
          IMAGE_OWNER: ${{ steps.images.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f compose.prod.yml config

      - name: Preparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}

      - name: Construire et publier l'image Streamlit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.streamlit
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.STREAMLIT_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ steps.images.outputs.owner }}/${{ env.STREAMLIT_IMAGE_NAME }}:${{ github.sha }}

  deployer-serveur:
    needs: construire-et-publier
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_APPLICATION == 'true'

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Preparer les fichiers de deploiement
        run: |
          tar --exclude='._*' --exclude='.DS_Store' -czf deploy-files.tar.gz \
            compose.prod.yml \
            sql \
            data/final \
            monitoring

      - name: Envoyer les fichiers de deploiement sur le serveur
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key deploy-files.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/immobilier-paris-deploy-files.tar.gz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             tar -xzf /tmp/immobilier-paris-deploy-files.tar.gz && \
             find monitoring \( -name '._*' -o -name '.DS_Store' \) -delete && \
             rm /tmp/immobilier-paris-deploy-files.tar.gz"

      - name: Mettre a jour l'application Docker sur le serveur
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_OWNER: ${{ needs.construire-et-publier.outputs.image_owner }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             printf '%s\n' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             export REGISTRY='ghcr.io' IMAGE_OWNER='$IMAGE_OWNER' IMAGE_TAG='latest' && \
             docker compose -f compose.prod.yml pull && \
             docker compose -f compose.prod.yml up -d && \
             docker compose -f compose.prod.yml ps"
