apiVersion: 1

providers:
  # C20 : Grafana charge automatiquement les dashboards du dossier monte par Docker.
  - name: Immobilier Paris
    orgId: 1
    folder: Immobilier Paris
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
