services:
  database:
    # C19 : base PostgreSQL utilisee par l'application sur le VPS.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/creation_tables.sql:/docker-entrypoint-initdb.d/01-creation-tables.sql:ro
      - ./sql/import_dvf_docker.sql:/docker-entrypoint-initdb.d/02-import-dvf.sql:ro
      - ./sql/creation_tables_utilisateurs.sql:/docker-entrypoint-initdb.d/03-creation-tables-utilisateurs.sql:ro
      - ./data/final/dvf_paris_clean_2021_2025.csv:/docker-entrypoint-initdb.d/dvf.csv:ro
      - ./data/final/annonces_scraping_nettoyees_golden.csv:/docker-entrypoint-initdb.d/scraping.csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    # Applique automatiquement les nouveaux fichiers SQL de sql/migrations.
    image: postgres:16-alpine
    restart: "no"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./sql/migrations:/migrations:ro
      - ./scripts/apply_sql_migrations.sh:/usr/local/bin/apply_sql_migrations.sh:ro
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/apply_sql_migrations.sh"]

  api:
    # C19 : en production, on ne reconstruit pas ici.
    # Le serveur recupere l'image deja publiee dans GHCR.
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/immobilier-paris-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      API_KEY: ${API_KEY}
      IDFM_API_KEY: ${IDFM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
    ports:
      # Le port reste local au serveur, puis Nginx gere l'acces public.
      - "127.0.0.1:8002:8000"
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  streamlit:
    # C19 : interface web recuperee depuis GitHub Container Registry.
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/immobilier-paris-streamlit:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY}
    ports:
      # Streamlit est expose localement sur le VPS, derriere Nginx.
      - "127.0.0.1:8501:8501"
    depends_on:
      - api

  prometheus:
    # C11/C20 : Prometheus collecte les metriques aussi en production.
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    # C11/C20 : Grafana affiche les dashboards de monitoring en production.
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
